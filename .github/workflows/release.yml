# The release workflow. A signed tag `vX.Y.Z` on main starts it.
#
# The workflow builds `rkc` for each host, makes a build provenance attestation for each binary,
# and publishes a GitHub release. Anybody can verify a binary with
# `gh attestation verify rkc-X.Y.Z-<target>.tar.gz --repo tamnd/rukernel-compat`.
#
# The release jobs use no cache. A cache that a pull request wrote must not go into a release.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-26
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the version in Cargo.toml agrees with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Cargo.toml has $version and the tag is $TAG"
            exit 1
          fi
      - name: cargo xtask ci
        run: cargo xtask ci
      - name: build and pack
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --bin rkc
          name="rkc-${TAG#v}-$TARGET"
          mkdir "$name"
          cp target/release/rkc LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rkc-${{ matrix.target }}
          path: rkc-*.tar.gz
          if-no-files-found: error

  publish:
    name: attest and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: download the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rkc-*' --dir dist
      - name: checksums
        run: |
          set -euo pipefail
          mkdir out
          find dist -name '*.tar.gz' -exec mv {} out/ \;
          cd out
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A maintainer can publish the release notes before this job runs. Then the job only
          # adds the files to that release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "rkc $TAG"
          fi

  # The crate goes to crates.io after the build passes on each target. The job uses the environment
  # `crates-io`, which only `v*` tags can use. The secret CARGO_REGISTRY_TOKEN in that environment is
  # a crates.io token with the publish-new and publish-update scopes. Without the secret, the job
  # writes a warning and publishes nothing. The script obeys the crates.io rate limits.
  crates:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::the environment crates-io has no CARGO_REGISTRY_TOKEN, so no crate is published"
            exit 0
          fi
          .github/scripts/publish-crates.sh rkc
