# The gate for each commit. Each job here must pass before a change merges.
#
# Each action is pinned to a full commit SHA. The version is in a comment. A tag can move and a SHA
# cannot. Dependabot moves the SHAs once a week, and zizmor examines this file in security.yml.
#
# The runner images have explicit names, not `-latest`. Thus a new image is a commit, and a green
# run does not change to red with no change in the tree.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new push cancels the run that it replaces. The default branch is not cancelled, because the
# badge and the bisect history use the runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # The cheapest checks run first. Thus a format mistake costs seconds and not a full matrix.
  quick:
    name: format, lints and house rules
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: prose rules
        run: cargo xtask style
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
      # The references and the register are data. An entry without a reason or an issue fails here.
      - name: rkc check
        run: cargo run --quiet --bin rkc -- check

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: linux arm64
            os: ubuntu-24.04-arm
          - name: macos arm64
            os: macos-26
          - name: windows x86-64
            os: windows-2025
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each test binary runs after a failure. Thus a run shows all failures on a host, not only
      # the first failure.
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  # deny.toml gives the licenses that Apache-2.0 can carry. This job also examines the advisory
  # database and the sources of each dependency.
  deny:
    name: licenses, advisories and sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  typos:
    name: spelling
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # L1, the ABI floor. The generated ABI of tamnd/rukernel on main must agree with the uAPI headers
  # of the reference. The job builds the headers from the reference tarball, so it takes some
  # minutes. The tarball stays in the cache.
  l1:
    name: l1 against the reference
    needs: quick
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamnd/rukernel
          path: rukernel
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rkc/*.tar.xz
          key: rkc-tarball-${{ hashFiles('references/*.toml') }}
          restore-keys: rkc-tarball-
      # The probes compile with clang. The runner image has it.
      - name: clang version
        run: clang --version
      - name: rkc l1
        run: cargo run --quiet --bin rkc -- l1 --reference 7.3 --abi rukernel/abi/7.3

  # The ruleset on main requires one check with the name `ci`. This job is that check. Thus a new
  # job in this file does not need a change to the ruleset.
  ci:
    name: ci
    if: always()
    needs: [quick, test, docs, deny, typos, l1]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: all jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required job did not pass"
              exit 1
            fi
          done
